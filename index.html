function showVid(b){const n='mashood-kuri-spin.'+(mime.indexOf('mp4')>-1?'mp4':'webm');$('vid').classList.remove('hidden');$('vd').onclick=()=>dl(b,n);$('vx').onclick=()=>$('vid').classList.add('hidden');$('vs').onclick=async()=>{const f=new File([b],n,{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Mashood Kuri Wheel'})}catch(e){}}else{dl(b,n);alert('ഷെയർ സപ്പോർട്ട് ഇല്ല - വീഡിയോ ഡൗൺലോഡ് ആയി. WhatsApp-ൽ attach ചെയ്യാം.')}}}
W({shuf(){if(spinning)return;for(let i=data.groups.length-1;i>0;i--){const j=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*(i+1));[data.groups[i],data.groups[j]]=[data.groups[j],data.groups[i]]}save()},
 togSnd(){snd=!snd;localStorage.snd=snd?'1':'0';alert(snd?'🔊 Sound ON':'🔇 Sound OFF');if(snd){ac();tk()}},
 manual(){const E=elig();if(!E.length)return alert('മെംബർമാർ ഇല്ല');modal('<h3 style="text-align:center">🌸</h3><p style="font-size:.8rem;color:var(--m);text-align:center">തിരഞ്ഞെടുത്ത ആളിൽ വീൽ നിർത്തും. SPIN അമർത്തിയാൽ കറങ്ങി അവിടെ വരും.<br><small>മെംബർമാർക്ക് അറിയില്ല</small></p><select id="msel">'+E.map(g=>'<option value="'+g.id+'">'+esc(g.mainName)+'</option>').join('')+'</select><button class="btn gd" onclick="manualGo()">തിരഞ്ഞെടുക്കുക</button><button class="btn o" onclick="closeM()">Cancel</button>')},
 manualGo(){const g=data.groups.find(x=>x.id===$('msel').value);if(!g)return;
  // Shuffle the wheel positions so it looks random
  for(let i=data.groups.length-1;i>0;i--){const j=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*(i+1));[data.groups[i],data.groups[j]]=[data.groups[j],data.groups[i]]}
  preWin=g;
  closeM();
  draw(true)},
 spin(){if(spinning)return;const E=elig();if(!E.length)return alert('മെംബർമാർ ഇല്ല');spinning=true;
  let wi;
  if(preWin){
   wi=E.findIndex(g=>g.id===preWin.id);
   if(wi<0){preWin=null;wi=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*E.length)}
  }else{
   wi=Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*E.length);
  }
  const s=Math.PI*2/E.length,P=Math.PI*2,st=rot,dl_=(((-(wi*s+s/2)-st)%P)+P)%P+P*12,dur=11000,t0=performance.now();
  ac();let lc=Math.floor(st/s);$('spinBtn').disabled=true;$('spinBtn').textContent='🌀 SPINNING...';startRec();
  (function f(t){const p=Math.min((t-t0)/dur,1);rot=st+dl_*(1-Math.pow(1-p,5));const c=Math.floor(rot/s);if(c!==lc){lc=c;tk()}drawWheel(rot);if(p<1)requestAnimationFrame(f);else{spinning=false;fanfare();win=E[wi];if(preWin){win.man=1;preWin=null}winTxt='🎉 '+win.mainName+' 🎉';setTimeout(stopRec,2000);
   modal('<div style="text-align:center"><h3>🎉 വിജയി!</h3><div class="wn">'+esc(win.mainName)+'</div><button class="btn" onclick="saveWin()">✅ Save Winner</button><button class="btn o" onclick="closeM();draw(true)">❌ Cancel</button></div>')}})(t0)},
 saveWin(){if(!win)return;const g=data.groups.find(x=>x.id===win.id);data.allWinners.push({mainName:win.mainName,subMembers:win.subMembers||[],date:new Date().toLocaleDateString(),manual:win.man?1:0});if(g)g.eligibility=false;win=null;closeM();save()}});
